<html>

    <body>

        <div class = "shade_class">
            <div class ="shade shade-1"></div>
            <div class ="shade shade-2"></div>
            <div class ="shade shade-3"></div>
            <div class ="shade shade-4"></div>
        </div>

        <nav>
            <a href = "#">Artists</a>

        <div class = "buttonclass">
            <button>Play</button>
        </div>
      <div class = "audio-box">
      <audio id = "player" controls></audio>
    </div>
    <br>
      <div class = "song_buttons">
      <button onclick="playsong(0)">Enjoy</button>  
      <button onclick="playsong(1)">Sunday Drive</button>  
      <button onclick="playsong(2)">Quite Fields</button> 
      </div>


      <script>
    const songs = [
        "audio/enjoy.mp3",
        "audio/sunday_drive.mp3",
        "audio/quite_fields.mp3"
    ];

    let player = document.getElementById("player");

    function playsong(index){
        player.src =songs[index];
        player.play();
    }
</script>
